[project]
name = "llm-wrapper-backend"
version = "0.1.0"
description = "LangGraph tool-calling 기반 LLM wrapper service (FastAPI)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "langchain>=1.0",
    "langgraph>=1.0",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# 모델 선정 후 provider 패키지를 골라 설치:  uv sync --extra anthropic
anthropic = ["langchain-anthropic"]
openai = ["langchain-openai"]
google = ["langchain-google-genai"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
